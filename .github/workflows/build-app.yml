# Builds app/ (relative paths, hash routing) on every push to main, so the latest merge can be seen at
# https://raw.githack.com/Anat1969/AshdodMitar/main/app/index.html even when the Vercel quota is used up.
name: build-app
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build-app, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:github
      - name: Commit app/ when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet && echo "no change" || (git commit -m "Build app/ for raw.githack" && git pull --rebase && git push)
